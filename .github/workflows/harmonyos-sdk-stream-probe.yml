name: HarmonyOS verified SDK streaming pair probe
on:
  push:
    branches: [harmonyos-bootstrap]
    paths: ['.github/workflows/harmonyos-sdk-stream-probe.yml'] # rerun fixed Build 86 native source
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        order: [archive-first, stream-first]
    env:
      GH_TOKEN: ${{ github.token }}
      SDK_FILE: ohos-sdk-linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: harmonyos
      - name: Download same official SDK shards
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/sdk-shards"
          cd "$RUNNER_TEMP/sdk-shards"
          gh release download 6.1.1.280 --repo ErBWs/ohos-sdk --pattern "$SDK_FILE.a?" --pattern "$SDK_FILE.sha256"
      - name: Compare verified archive and stream, build clean HAP twice
        env:
          ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk-shards"
          digest="$(awk 'NR==1 {print $1}' "$SDK_FILE.sha256")"
          [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]]
          if [[ "$ORDER" == archive-first ]]; then modes=(archive stream); else modes=(stream archive); fi
          for mode in "${modes[@]}"; do
            dir="$RUNNER_TEMP/sdk-pair"
            mkdir "$dir"
            start=$(date +%s%N)
            if [[ "$mode" == archive ]]; then
              cat "$SDK_FILE.aa" "$SDK_FILE.ab" > "$SDK_FILE"
              printf '%s  %s\n' "$digest" "$SDK_FILE" | sha256sum -c -
              pigz -dc "$SDK_FILE" | tar -xf - -C "$dir"
              rm "$SDK_FILE"
            else
              actual="$(cat "$SDK_FILE.aa" "$SDK_FILE.ab" | sha256sum | cut -d' ' -f1)"
              test "$actual" = "$digest"
              cat "$SDK_FILE.aa" "$SDK_FILE.ab" | pigz -dc | tar -xf - -C "$dir"
            fi
            end=$(date +%s%N)
            echo "$mode verified preparation nanoseconds=$((end-start))" | tee -a "$GITHUB_STEP_SUMMARY"
            python3 - "$dir" > "$mode.manifest" <<'PY'
          import os,sys,pathlib,stat,hashlib
          root=pathlib.Path(sys.argv[1])
          for p in sorted(root.rglob('*')):
              s=p.lstat()
              if p.is_symlink(): value=os.readlink(p)
              elif p.is_file():
                  with p.open('rb') as f: value=hashlib.file_digest(f,'sha256').hexdigest()
              else: value=''
              print(p.relative_to(root),stat.S_IFMT(s.st_mode),stat.S_IMODE(s.st_mode),value,sep='\t')
          PY
            (cd "$GITHUB_WORKSPACE"
             git clean -fdx -- harmonyos
             cd harmonyos
             export PATH="$dir/command-line-tools/bin:$dir/command-line-tools/tool/node/bin:$PATH"
             export DEVECO_SDK_HOME="$dir/command-line-tools/sdk" HOS_SDK_HOME="$dir/command-line-tools/sdk"
             ohpm install --all
             hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug --no-daemon
             hap="$(find entry/build -type f -name '*.hap' -print -quit)"
             test -s "$hap"; cp "$hap" "$RUNNER_TEMP/$mode.hap")
            rm -rf "$dir"
          done
          cmp archive.manifest stream.manifest
          python3 - "$RUNNER_TEMP/archive.hap" "$RUNNER_TEMP/stream.hap" <<'PY'
          import sys,zipfile,hashlib
          def manifest(path):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  return {n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.endswith('/')}
          assert manifest(sys.argv[1])==manifest(sys.argv[2])
          print('Verified SDK files and native HAP entries equivalent')
          PY
