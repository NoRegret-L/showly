name: HarmonyOS SDK traced dependency closure
# Recheck exact Build 96 correction revision; no candidate is promoted without proof.
on:
  push:
    branches: [harmonyos-bootstrap, harmonyos-build101]
    paths: ['.github/workflows/harmonyos-sdk-closure-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: harmonyos
          fetch-depth: 4
      - name: Prepare verified streaming SDK
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/verified-sdk"
          mkdir "$dir"
          cd "$dir"
          file=ohos-sdk-linux-amd64.tar.gz
          gh release download 6.1.1.280 --repo ErBWs/ohos-sdk --pattern "$file.a?" --pattern "$file.sha256"
          digest="$(awk 'NR==1 {print $1}' "$file.sha256")"
          [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]]
          actual="$(cat "$file.aa" "$file.ab" | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$digest"
          start=$(date +%s%N)
          cat "$file.aa" "$file.ab" | pigz -dc | tar -xf -
          echo "full extraction nanoseconds=$(( $(date +%s%N)-start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$dir/command-line-tools/bin" >> "$GITHUB_PATH"
          echo "$dir/command-line-tools/tool/node/bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$dir/command-line-tools/sdk" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$dir/command-line-tools/sdk" >> "$GITHUB_ENV"
      - name: Trace parent and current revisions; test independent filtered extraction
        run: |
          set -euo pipefail
          command -v strace || { sudo apt-get update -qq; sudo apt-get install -y strace; }
          dir="$RUNNER_TEMP/verified-sdk"
          file=ohos-sdk-linux-amd64.tar.gz
          build=(hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug --no-daemon --optimization-strategy=performance)
          parent="$RUNNER_TEMP/parent-source"
          mkdir "$parent"
          baseline=de94604d5cd3015ddedcda3d2f4da49c194c0d7f
          git cat-file -e "$baseline^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$baseline"
          git archive "$baseline" harmonyos | tar -xf - -C "$parent"
          echo "Closure parent=$(git rev-parse "$baseline") current=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          (cd "$parent/harmonyos"
           ohpm install --all
           strace -ff -yy -s 4096 -e trace=%file,getdents64 -o "$RUNNER_TEMP/sdktrace-parent" "${build[@]}")
          rm -rf "$parent"
          (cd harmonyos
           ohpm install --all
           strace -ff -yy -s 4096 -e trace=%file,getdents64 -o "$RUNNER_TEMP/sdktrace" "${build[@]}"
           hap="$(find entry/build -type f -name '*.hap' -print -quit)"
           test -s "$hap"; cp "$hap" "$RUNNER_TEMP/full.hap")
          # Union both revision traces; also test the previous revision's
          # independent exclusion list against the current source.
          python3 harmonyos/tools/sdk_trace_closure.py "$dir" "$RUNNER_TEMP/sdktrace-parent" "$RUNNER_TEMP/sdk-parent-excludes.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 harmonyos/tools/sdk_trace_closure.py "$dir" "$RUNNER_TEMP/sdktrace" "$RUNNER_TEMP/sdk-excludes.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          sort "$RUNNER_TEMP/sdk-parent-excludes.txt" > "$RUNNER_TEMP/parent-sorted"
          sort "$RUNNER_TEMP/sdk-excludes.txt" > "$RUNNER_TEMP/current-sorted"
          comm -12 "$RUNNER_TEMP/parent-sorted" "$RUNNER_TEMP/current-sorted" > "$RUNNER_TEMP/sdk-excludes.txt"
          comm -23 "$RUNNER_TEMP/parent-sorted" "$RUNNER_TEMP/current-sorted" | tee "$RUNNER_TEMP/new-dependency-paths.txt"
          echo "Cross-version conservative exclusion lines=$(wc -l < "$RUNNER_TEMP/sdk-excludes.txt")" | tee -a "$GITHUB_STEP_SUMMARY"
          test -s "$RUNNER_TEMP/sdk-excludes.txt" || { echo "No conservative exclusions found"; exit 1; }
          git clean -fdx -- harmonyos
          (cd "$dir"
           rm -rf command-line-tools
           start=$(date +%s%N)
           cat "$file.aa" "$file.ab" | pigz -dc | tar --exclude-from="$RUNNER_TEMP/sdk-excludes.txt" -xf -
           echo "filtered extraction nanoseconds=$(( $(date +%s%N)-start ))" | tee -a "$GITHUB_STEP_SUMMARY")
          # Measure local compressed candidate; main CI continues to use verified full SDK.
          (cd "$dir"
           start=$(date +%s%N)
           tar -cf - command-line-tools | zstd -T0 -3 -o "$RUNNER_TEMP/closure-sdk.tar.zst"
           sha256sum "$RUNNER_TEMP/closure-sdk.tar.zst" > "$RUNNER_TEMP/closure-sdk.sha256"
           echo "closure cache pack nanoseconds=$(( $(date +%s%N)-start )) bytes=$(stat -c%s "$RUNNER_TEMP/closure-sdk.tar.zst")" | tee -a "$GITHUB_STEP_SUMMARY"
           rm -rf command-line-tools
           start=$(date +%s%N)
           sha256sum -c "$RUNNER_TEMP/closure-sdk.sha256"
           zstd -dc "$RUNNER_TEMP/closure-sdk.tar.zst" | tar -xf -
           echo "closure cache restore nanoseconds=$(( $(date +%s%N)-start ))" | tee -a "$GITHUB_STEP_SUMMARY")
          (cd harmonyos
           ohpm install --all
           start=$(date +%s%N)
           "${build[@]}"
           echo "filtered cold HAP nanoseconds=$(( $(date +%s%N)-start ))" | tee -a "$GITHUB_STEP_SUMMARY"
           hap="$(find entry/build -type f -name '*.hap' -print -quit)"
           test -s "$hap"; cp "$hap" "$RUNNER_TEMP/filtered.hap")
          python3 - "$RUNNER_TEMP/full.hap" "$RUNNER_TEMP/filtered.hap" <<'PY'
          import sys,zipfile,hashlib
          def manifest(path):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  return {n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.endswith('/')}
          a,b=map(manifest,sys.argv[1:])
          assert a==b,sorted(k for k in a.keys()|b.keys() if a.get(k)!=b.get(k))
          print('Traced SDK candidate HAP entries equivalent')
          PY
      - name: Record independent candidate digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closure-proof"
          sha256sum "$RUNNER_TEMP/closure-sdk.tar.zst" | cut -d' ' -f1 > "$RUNNER_TEMP/closure-proof/sha256"
          sha256sum "$RUNNER_TEMP/full.hap" | cut -d' ' -f1 > "$RUNNER_TEMP/closure-proof/hap-sha256"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/closure-proof/source"
          printf '%s\n' "closure-6.1.1.280-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" > "$RUNNER_TEMP/closure-proof/key"
      - name: Upload independent closure proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-closure-proof-${{ github.sha }}
          path: ${{ runner.temp }}/closure-proof/
          if-no-files-found: error
      - name: Upload portable SDK archive for exact future cross-branch restoration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-portable-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/closure-sdk.tar.zst
          compression-level: 0
          if-no-files-found: error
      - name: Save exact candidate for remote restore experiment
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/closure-sdk.tar.zst
            ${{ runner.temp }}/closure-sdk.sha256
            ${{ runner.temp }}/full.hap
          key: closure-6.1.1.280-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  remote-restore:
    needs: pair
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: harmonyos
      - name: Download independent candidate proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sdk-closure-proof-$GITHUB_SHA" --dir "$RUNNER_TEMP/closure-proof"
          [[ "$(cat "$RUNNER_TEMP/closure-proof/source")" == "$GITHUB_SHA" ]]
          [[ "$(cat "$RUNNER_TEMP/closure-proof/key")" == "closure-6.1.1.280-Linux-X64-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]
      - name: Start remote cache timer
        run: date +%s%N > "$RUNNER_TEMP/cache-start"
      - name: Restore exact candidate
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/closure-sdk.tar.zst
            ${{ runner.temp }}/closure-sdk.sha256
            ${{ runner.temp }}/full.hap
          key: closure-6.1.1.280-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure remote restore and verify independent native build
        run: |
          set -euo pipefail
          echo "remote cache transfer nanoseconds=$(( $(date +%s%N)-$(cat "$RUNNER_TEMP/cache-start") ))" | tee -a "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP"
          digest="$(cat closure-proof/sha256)"
          hap_digest="$(cat closure-proof/hap-sha256)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ && "$hap_digest" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$digest" closure-sdk.tar.zst | sha256sum -c -
          printf '%s  %s\n' "$hap_digest" full.hap | sha256sum -c -
          echo "Independent archive SHA256: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir verified-sdk
          zstd -dc closure-sdk.tar.zst | tar -xf - -C verified-sdk
          echo "remote cache ready nanoseconds=$(( $(date +%s%N)-$(cat "$RUNNER_TEMP/cache-start") ))" | tee -a "$GITHUB_STEP_SUMMARY"
          export PATH="$RUNNER_TEMP/verified-sdk/command-line-tools/bin:$RUNNER_TEMP/verified-sdk/command-line-tools/tool/node/bin:$PATH"
          export DEVECO_SDK_HOME="$RUNNER_TEMP/verified-sdk/command-line-tools/sdk"
          export HOS_SDK_HOME="$DEVECO_SDK_HOME"
          cd "$GITHUB_WORKSPACE/harmonyos"
          ohpm install --all
          hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug --no-daemon --optimization-strategy=performance
          hap="$(find entry/build -type f -name '*.hap' -print -quit)"
          test -s "$hap"
          python3 - "$RUNNER_TEMP/full.hap" "$hap" <<'PY'
          import sys,zipfile,hashlib
          def manifest(path):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  return {n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.endswith('/')}
          assert manifest(sys.argv[1])==manifest(sys.argv[2])
          print('Remote cache HAP entries equivalent; experiment only')
          PY

  cross-version-restore:
    needs: pair
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: harmonyos
      - name: Restore current full HAP reference
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/closure-sdk.tar.zst
            ${{ runner.temp }}/closure-sdk.sha256
            ${{ runner.temp }}/full.hap
          key: closure-6.1.1.280-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Preserve reference and start independent old-cache timer
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/full.hap" "$RUNNER_TEMP/current-full.hap"
          rm "$RUNNER_TEMP/closure-sdk.tar.zst" "$RUNNER_TEMP/closure-sdk.sha256"
          date +%s%N > "$RUNNER_TEMP/cache-start"
      - name: Restore previous Build 100 closure (branch-scoped candidate)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/closure-sdk.tar.zst
            ${{ runner.temp }}/closure-sdk.sha256
            ${{ runner.temp }}/full.hap
          key: closure-6.1.1.280-Linux-X64-de94604d5cd3015ddedcda3d2f4da49c194c0d7f-46165771584-1
          fail-on-cache-miss: false
      - name: Test old closure; reject incompatible build and recover with full SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP"
          echo "Cross-version transfer nanoseconds=$(( $(date +%s%N)-$(cat cache-start) ))" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir old-sdk
          if [[ -s closure-sdk.tar.zst && -s closure-sdk.sha256 ]]; then
            sha256sum -c closure-sdk.sha256
            zstd -dc closure-sdk.tar.zst | tar -xf - -C old-sdk
          else
            echo "Old closure not visible on this isolated branch; full verified fallback required" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "Cross-version SDK ready nanoseconds=$(( $(date +%s%N)-$(cat cache-start) ))" | tee -a "$GITHUB_STEP_SUMMARY"
          # The old candidate is an experimental input only. Its failure is
          # recorded, never interpreted as a successful compatible build.
          cat > "$RUNNER_TEMP/compare-hap.py" <<'PY'
          import sys,zipfile,hashlib
          def manifest(path):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  return {n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.endswith('/')}
          assert manifest(sys.argv[1])==manifest(sys.argv[2])
          PY
          build_sdk() (
            set -euo pipefail
            export PATH="$1/command-line-tools/bin:$1/command-line-tools/tool/node/bin:$PATH"
            export DEVECO_SDK_HOME="$1/command-line-tools/sdk"
            export HOS_SDK_HOME="$DEVECO_SDK_HOME"
            unset GH_TOKEN
            cd "$root/harmonyos"
            ohpm install --all || exit $?
            hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug --no-daemon --optimization-strategy=performance || exit $?
            hap="$(find entry/build -type f -name '*.hap' -print -quit)"
            test -s "$hap" || exit 1
            python3 "$RUNNER_TEMP/compare-hap.py" "$RUNNER_TEMP/current-full.hap" "$hap" || exit $?
          )
          if [[ -d "$RUNNER_TEMP/old-sdk/command-line-tools" ]] && build_sdk "$RUNNER_TEMP/old-sdk" > "$RUNNER_TEMP/old-sdk-build.log" 2>&1; then
            echo "Old closure compatible: HAP entries equivalent" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [[ -f "$RUNNER_TEMP/old-sdk-build.log" ]]; then tail -n 35 "$RUNNER_TEMP/old-sdk-build.log"; fi
            echo "Old closure REJECTED (incompatible); testing full verified SDK fallback" | tee -a "$GITHUB_STEP_SUMMARY"
            cd "$root"
            git clean -fdx -- harmonyos
            rm -rf "$RUNNER_TEMP/old-sdk"
            mkdir "$RUNNER_TEMP/full-sdk"
            cd "$RUNNER_TEMP/full-sdk"
            start=$(date +%s%N)
            file=ohos-sdk-linux-amd64.tar.gz
            gh release download 6.1.1.280 --repo ErBWs/ohos-sdk --pattern "$file.a?" --pattern "$file.sha256"
            digest="$(awk 'NR==1 {print $1}' "$file.sha256")"
            [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]]
            actual="$(cat "$file.aa" "$file.ab" | sha256sum | cut -d' ' -f1)"
            [[ "$actual" == "$digest" ]]
            cat "$file.aa" "$file.ab" | pigz -dc | tar -xf -
            echo "Full fallback SDK ready nanoseconds=$(( $(date +%s%N)-start ))" | tee -a "$GITHUB_STEP_SUMMARY"
            build_sdk "$RUNNER_TEMP/full-sdk"
            echo "Full SDK fallback succeeded; HAP entries equivalent" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
