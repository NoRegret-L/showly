name: HarmonyOS preview CI and release

on:
  push:
    branches: [harmonyos-bootstrap, harmonyos-build99]
    paths:
      - '.github/workflows/harmonyos-bootstrap.yml'
      - 'harmonyos/**'
      - '.github/ci/ts/onepass_graph.py'
      - '.github/ci/ts/onepass-bin/**'
      - '.github/ci/ts/project_outputs.cjs'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe checks the SDK; build requires a native HarmonyOS project'
        type: choice
        options: [probe, build]
        default: probe

permissions:
  contents: read

concurrency:
  group: harmonyos-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: harmonyos

      - name: Record upstream revision
        run: |
          set -euo pipefail
          git ls-remote https://github.com/trakt/showly.git refs/heads/master | tee upstream-revision.txt
          test -s upstream-revision.txt
          upstream="$(cut -f1 upstream-revision.txt)"
          baseline="$(cat harmonyos/upstream-baseline.txt)"
          [[ "$upstream" =~ ^[0-9a-f]{40}$ && "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "Upstream revision: $upstream" >> "$GITHUB_STEP_SUMMARY"
          echo "Recorded observation baseline: $baseline (not port completeness)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$upstream" != "$baseline" ]]; then
            echo "::notice::Android upstream changed; native port requires review."
            echo "[Review Android changes](https://github.com/trakt/showly/compare/$baseline...$upstream)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No change from observation baseline." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate source release versions
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        run: |
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "harmonyos/tools"); from prepare_preview_release import validate_source; validate_source(Path("harmonyos")); print("Source release version checks passed")'

      - name: Preflight ArkUI before SDK download
        if: ${{ hashFiles('harmonyos/build-profile.json5') != '' }}
        run: python3 harmonyos/tools/preflight_arkui.py

      # Optional production candidate. Only an independently reviewed digest
      # committed to source enables it; no restore-keys or self-signed cache.
      - name: Read trusted closure pin
        id: closure-pin
        run: |
          set -euo pipefail
          pin=harmonyos/ci/sdk-closure-pin.txt
          if [[ ! -f "$pin" ]]; then exit 0; fi
          mapfile -t lines < "$pin"
          [[ ${#lines[@]} == 2 && "${lines[0]}" =~ ^closure-6\.1\.1\.280-Linux-X64-[a-f0-9]{40}-[0-9]+-[0-9]+$ && "${lines[1]}" =~ ^[a-f0-9]{64}$ ]] || exit 1
          echo "key=${lines[0]}" >> "$GITHUB_OUTPUT"
          echo "sha=${lines[1]}" >> "$GITHUB_OUTPUT"
      - name: Restore independently pinned SDK candidate
        if: steps.closure-pin.outputs.key != ''
        id: closure-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/closure-sdk.tar.zst
            ${{ runner.temp }}/closure-sdk.sha256
            ${{ runner.temp }}/full.hap
          key: ${{ steps.closure-pin.outputs.key }}
      - name: Try verified cached native build
        if: steps.closure-cache.outputs.cache-hit == 'true'
        id: closure-build
        continue-on-error: true
        env:
          PINNED_SHA: ${{ steps.closure-pin.outputs.sha }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' "$PINNED_SHA" closure-sdk.tar.zst | sha256sum -c -
          mkdir -p closure-native
          zstd -dc closure-sdk.tar.zst | tar -xf - -C closure-native
          export PATH="$RUNNER_TEMP/closure-native/command-line-tools/bin:$RUNNER_TEMP/closure-native/command-line-tools/tool/node/bin:$PATH"
          export HOS_SDK_HOME="$RUNNER_TEMP/closure-native/command-line-tools/sdk"
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          cd "$GITHUB_WORKSPACE"
          node --version; ohpm --version; hvigorw --version
          python3 harmonyos/tools/preflight_arkui.py --sdk "$HOS_SDK_HOME"
          cd harmonyos
          ohpm install --all
          hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug --no-daemon --optimization-strategy=performance
          test -n "$(find entry/build -type f -name '*.hap' -print -quit)"
          echo "Verified closure build seconds=$(( $(date +%s)-start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clean failed candidate before full fallback
        if: steps.closure-build.outcome == 'failure'
        run: |
          set -euo pipefail
          git clean -fdx -- harmonyos
          rm -rf "$RUNNER_TEMP/closure-native"
      - name: Check out pinned SDK setup
        if: steps.closure-build.outcome != 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ErBWs/setup-ohos
          ref: 4dbb63025116eb6165ceac58a4bf47cbdc5ac721
          path: .ci-sdk-setup
          persist-credentials: false

      # Build 77 stock-runner probe passed both cold and warm HAP builds.
      # Keep pinned setup and verified archive; no unmeasured cache or apt.
      - name: Prepare SDK on stock runner
        if: steps.closure-build.outcome != 'success'
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          dpkg-query -W libgl1-mesa-dev libgl1 || true
          # Same pinned setup and exports. Verify the complete concatenated
          # byte stream before extraction; never execute an unverified SDK.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.ci-sdk-setup/setup.sh')
          s=p.read_text()
          start=s.index('    gh release download $VERSION')
          end=s.index('    rm $FILENAME.*',start)+len('    rm $FILENAME.*')
          old=s[start:end]
          assert 'sha256sum -c $FILENAME.sha256' in old and 'cat $FILENAME.aa $FILENAME.ab > $FILENAME' in old
          s=s[:start]+'''    set -o pipefail
              phase_start=$(date +%s)
              gh release download "$VERSION" -p "$FILENAME.*" -R ErBWs/ohos-sdk
              echo "SDK download seconds=$(( $(date +%s)-phase_start ))" | tee -a "$GITHUB_STEP_SUMMARY"
              phase_start=$(date +%s)
              digest="$(awk 'NR==1 {print $1}' "$FILENAME.sha256")"
              [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]]
              actual="$(cat "$FILENAME.aa" "$FILENAME.ab" | sha256sum | cut -d' ' -f1)"
              [[ "$actual" == "$digest" ]] || { echo "Checksum failed"; exit 1; }
              echo "SDK assemble and checksum seconds=$(( $(date +%s)-phase_start ))" | tee -a "$GITHUB_STEP_SUMMARY"
              phase_start=$(date +%s)
              rm -rf command-line-tools
              if command -v pigz >/dev/null && (cat "$FILENAME.aa" "$FILENAME.ab" | pigz -dc | tar -xf -); then
                echo "SDK extraction: verified stream + pigz"
              else
                rm -rf command-line-tools
                cat "$FILENAME.aa" "$FILENAME.ab" | gzip -dc | tar -xf -
              fi
              echo "SDK extract seconds=$(( $(date +%s)-phase_start ))" | tee -a "$GITHUB_STEP_SUMMARY"
              rm "$FILENAME".*'''+s[end:]
          p.write_text(s)
          PY
          bash .ci-sdk-setup/setup.sh -v '6.1.1.280'
          echo "SDK setup seconds=$(( $(date +%s)-start ))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify toolchain
        if: steps.closure-build.outcome != 'success'
        run: |
          set -euo pipefail
          node --version
          ohpm --version
          hvigorw --version
          python3 harmonyos/tools/preflight_arkui.py --sdk "$HOS_SDK_HOME"
          echo "SDK probe passed. This is not an HAP build." >> "$GITHUB_STEP_SUMMARY"

      - name: Require native project for explicit build
        if: ${{ inputs.mode == 'build' }}
        run: |
          test -f harmonyos/build-profile.json5 || {
            echo "::error::No native HarmonyOS project exists yet."
            exit 1
          }

      - name: Install project dependencies
        if: ${{ steps.closure-build.outcome != 'success' && (inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '') }}
        working-directory: harmonyos
        run: ohpm install --all

      - name: Build native HAP
        if: ${{ steps.closure-build.outcome != 'success' && (inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '') }}
        working-directory: harmonyos
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          start=$(date +%s)
          hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug --no-daemon --optimization-strategy=performance
          echo "Native HAP seconds=$(( $(date +%s)-start ))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload experimental HAP
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-hap-${{ github.sha }}
          path: |
            harmonyos/entry/build/**/*.hap
            upstream-revision.txt
          compression-level: 0
          if-no-files-found: error

  # Host-only regressions do not depend on HarmonyOS SDK or HAP output.
  # Run alongside native compilation; release requires both exact-SHA jobs.
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            harmonyos
            .github/ci/ts

      - name: Validate source release versions
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        run: |
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "harmonyos/tools"); from prepare_preview_release import validate_source; validate_source(Path("harmonyos")); print("Source release version checks passed")'

      # Pure model regressions must pass before a preview can be released.
      - name: Test personal library and observation models
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        run: |
          set -euo pipefail
          python3 harmonyos/tools/preflight_detail.py
          python3 harmonyos/tools/preflight_statistics.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci/ts
          export SHOWLY_REAL_TSC="$GITHUB_WORKSPACE/.github/ci/ts/node_modules/.bin/tsc"
          export PATH="$GITHUB_WORKSPACE/.github/ci/ts/node_modules/.bin:$PATH"
          export SHOWLY_ONEPASS_QUEUE="$RUNNER_TEMP/onepass"
          # Same 34 historical fixtures; per-project independent compiler fallback.
          python3 .github/ci/ts/onepass_graph.py | tee "$RUNNER_TEMP/onepass.log"
          python3 harmonyos/tools/test_custom_lists.py
          python3 harmonyos/tools/test_statistics.py
          python3 harmonyos/tools/test_list_persistence.py
          python3 harmonyos/tools/test_ratings.py
          python3 harmonyos/tools/test_people.py
          python3 harmonyos/tools/test_availability.py
          python3 harmonyos/tools/test_comments.py
          python3 harmonyos/tools/test_gallery.py
          python3 harmonyos/tools/test_sync_coordinator.py
          python3 harmonyos/tools/test_observation_delta.py
          python3 harmonyos/tools/test_sync_batch_index.py
          python3 harmonyos/tools/test_sync_schedule.py
          python3 harmonyos/tools/test_background_observation.py
          python3 harmonyos/tools/test_startup_read_state.py
          python3 harmonyos/tools/test_manual_sync.py
          python3 harmonyos/tools/test_export_evidence.py
          python3 harmonyos/tools/test_sync_merge_batch.py
          echo '34 historical regressions and custom-list, statistics, list persistence, rating and people specialist gates passed' >> "$GITHUB_STEP_SUMMARY"

  publish-preview:
    needs: [verify, regressions]
    if: ${{ github.event_name == 'push' && github.repository == 'NoRegret-L/showly' && (github.ref == 'refs/heads/harmonyos-bootstrap' || github.ref == 'refs/heads/harmonyos-build99') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact built revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            harmonyos/AppScope/app.json5
            harmonyos/package.json
            harmonyos/entry/oh-package.json5
            harmonyos/build-profile.json5
            harmonyos/upstream-baseline.txt
            harmonyos/entry/src/main/ets/config/BuildInfo.ets
            harmonyos/tools/prepare_preview_release.py
          sparse-checkout-cone-mode: false

      # No SDK setup, app credentials, or build scripts run in the write job.
      - name: Download successful build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "experimental-hap-$GITHUB_SHA" --dir "$RUNNER_TEMP/hap-input"
          test -s "$RUNNER_TEMP/hap-input/upstream-revision.txt"

      - name: Validate and prepare unsigned preview
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          python3 harmonyos/tools/prepare_preview_release.py \
            --source "$GITHUB_WORKSPACE" \
            --hap-dir "$RUNNER_TEMP/hap-input" \
            --upstream "$RUNNER_TEMP/hap-input/upstream-revision.txt" \
            --output "$RUNNER_TEMP/release" \
            --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Publish verified preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^harmonyos-v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-b[1-9][0-9]*$ ]]
          cd "$RUNNER_TEMP/release"
          # Never overwrite or move an existing release/tag. A retry after a
          # failed draft requires maintainer inspection, not automatic cleanup.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists. Inspect it; increment versionCode for a new build."
            exit 1
          fi
          # A stale run must not create tags on an advanced branch tip.
          [[ "$GITHUB_REF_NAME" == harmonyos-bootstrap || "$GITHUB_REF_NAME" == harmonyos-build99 ]]
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          [[ "$head" == "$GITHUB_SHA" ]] || { echo "::error::Branch advanced during verification; build the current tip."; exit 1; }
          echo "Release phase: inspect exact tag"
          if ! existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>"$RUNNER_TEMP/tag-error")"; then
            cat "$RUNNER_TEMP/tag-error"
            grep -q 'HTTP 404' "$RUNNER_TEMP/tag-error" || { echo "::error::Tag lookup failed (not a missing tag)"; exit 1; }
            echo "Release phase: create exact tag"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null || { echo "::error::Tag creation denied or failed; inspect repository tag rules and Actions token access"; exit 1; }
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          fi
          [[ "$existing" == "$GITHUB_SHA" ]] || { echo "::error::Tag points to another commit"; exit 1; }
          echo 'Release phase: create verified draft and upload assets'
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Showly HarmonyOS $TAG (unsigned preview)" --notes-file release-notes.md \
            "showly-$TAG-unsigned.hap" SHA256SUMS.txt release-info.json
          echo 'Release phase: inspect uploaded asset integrity'
          release_id="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > remote-assets.json
          for file in "showly-$TAG-unsigned.hap" SHA256SUMS.txt release-info.json; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            size="$(stat -c%s "$file")"
            jq -e --arg file "$file" --arg digest "$digest" --argjson size "$size" \
              '[.[] | select(.name == $file and .state == "uploaded" and .digest == $digest and .size == $size)] | length == 1' \
              remote-assets.json >/dev/null
          done
          echo 'Release phase: publish verified draft'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          echo "[Unsigned preview release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
