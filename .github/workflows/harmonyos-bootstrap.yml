name: HarmonyOS preview CI and release

on:
  push:
    branches: [harmonyos-bootstrap]
    paths:
      - '.github/workflows/harmonyos-bootstrap.yml'
      - 'harmonyos/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe checks the SDK; build requires a native HarmonyOS project'
        type: choice
        options: [probe, build]
        default: probe

permissions:
  contents: read

concurrency:
  group: harmonyos-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record upstream revision
        run: |
          set -euo pipefail
          git ls-remote https://github.com/trakt/showly.git refs/heads/master | tee upstream-revision.txt
          test -s upstream-revision.txt
          upstream="$(cut -f1 upstream-revision.txt)"
          baseline="$(cat harmonyos/upstream-baseline.txt)"
          [[ "$upstream" =~ ^[0-9a-f]{40}$ && "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "Upstream revision: $upstream" >> "$GITHUB_STEP_SUMMARY"
          echo "Recorded observation baseline: $baseline (not port completeness)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$upstream" != "$baseline" ]]; then
            echo "::notice::Android upstream changed; native port requires review."
            echo "[Review Android changes](https://github.com/trakt/showly/compare/$baseline...$upstream)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No change from observation baseline." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate source release versions
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        run: |
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "harmonyos/tools"); from prepare_preview_release import validate_source; validate_source(Path("harmonyos")); print("Source release version checks passed")'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      # Third-party SDK distribution. No signing or API secrets in this job.
      - name: Set up HarmonyOS CLI
        id: sdk
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721
        with:
          version: '6.1.1.280'
          cache: false

      - name: Verify toolchain
        run: |
          set -euo pipefail
          node --version
          ohpm --version
          hvigorw --version
          echo "SDK probe passed. This is not an HAP build." >> "$GITHUB_STEP_SUMMARY"

      - name: Require native project for explicit build
        if: ${{ inputs.mode == 'build' }}
        run: |
          test -f harmonyos/build-profile.json5 || {
            echo "::error::No native HarmonyOS project exists yet."
            exit 1
          }

      - name: Install project dependencies
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        working-directory: harmonyos
        run: ohpm install --all

      # Pure model regressions must pass before a preview can be released.
      - name: Test personal library and observation models
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        run: |
          set -euo pipefail
          npm exec --yes --package=typescript@5.8.3 -- sh -c 'python3 harmonyos/tools/test_personal_library.py && python3 harmonyos/tools/test_library_index.py && python3 harmonyos/tools/test_show_catalog.py && python3 harmonyos/tools/test_remote_observation.py && python3 harmonyos/tools/test_effective_state.py && python3 harmonyos/tools/test_feature_first.py && python3 harmonyos/tools/test_title_quick.py && python3 harmonyos/tools/test_navigation.py && python3 harmonyos/tools/test_progress_rules.py && python3 harmonyos/tools/test_presentation.py && python3 harmonyos/tools/test_movie_progress.py && python3 harmonyos/tools/test_startup_performance.py && python3 harmonyos/tools/test_persistent_projection.py && python3 harmonyos/tools/test_collection_rules.py && python3 harmonyos/tools/test_batch_projection.py && python3 harmonyos/tools/test_shared_reads.py && python3 harmonyos/tools/test_rendering_performance.py && python3 harmonyos/tools/test_indexed_projection.py && python3 harmonyos/tools/test_display_isolation.py && python3 harmonyos/tools/test_discover_cache.py && python3 harmonyos/tools/test_calendar_local.py && python3 harmonyos/tools/test_presentation_policy.py && python3 harmonyos/tools/test_search_local.py && python3 harmonyos/tools/test_progress_candidates.py && python3 harmonyos/tools/test_cache_lifecycle.py && python3 harmonyos/tools/test_consumer_lifecycle.py && python3 harmonyos/tools/test_scroll_anchor.py && python3 harmonyos/tools/test_viewport_scheduler.py && python3 harmonyos/tools/test_detail_session.py && python3 harmonyos/tools/test_commit_delta.py && python3 harmonyos/tools/test_artwork_pipeline.py && python3 harmonyos/tools/test_projection_delta.py && python3 harmonyos/tools/test_presentation_queue.py && python3 harmonyos/tools/test_page_state_owner.py'

      - name: Build native HAP
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        working-directory: harmonyos
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug --no-daemon

      - name: Upload experimental HAP
        if: ${{ inputs.mode == 'build' || hashFiles('harmonyos/build-profile.json5') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-hap-${{ github.sha }}
          path: harmonyos/entry/build/**/*.hap
          if-no-files-found: error

      - name: Upload upstream revision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-revision
          path: upstream-revision.txt
          if-no-files-found: error

  publish-preview:
    needs: verify
    if: ${{ github.event_name == 'push' && github.repository == 'NoRegret-L/showly' && github.ref == 'refs/heads/harmonyos-bootstrap' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact built revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No SDK setup, app credentials, or build scripts run in the write job.
      - name: Download successful build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "experimental-hap-$GITHUB_SHA" --dir "$RUNNER_TEMP/hap-input"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name upstream-revision --dir "$RUNNER_TEMP/upstream-input"

      - name: Validate and prepare unsigned preview
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          python3 harmonyos/tools/prepare_preview_release.py \
            --source "$GITHUB_WORKSPACE" \
            --hap-dir "$RUNNER_TEMP/hap-input" \
            --upstream "$RUNNER_TEMP/upstream-input/upstream-revision.txt" \
            --output "$RUNNER_TEMP/release" \
            --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Publish verified preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^harmonyos-v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-b[1-9][0-9]*$ ]]
          cd "$RUNNER_TEMP/release"
          # Never overwrite or move an existing release/tag. A retry after a
          # failed draft requires maintainer inspection, not automatic cleanup.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists. Inspect it; increment versionCode for a new build."
            exit 1
          fi
          if ! existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          fi
          [[ "$existing" == "$GITHUB_SHA" ]] || { echo "::error::Tag points to another commit"; exit 1; }
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Showly HarmonyOS $TAG (unsigned preview)" --notes-file release-notes.md \
            "showly-$TAG-unsigned.hap" SHA256SUMS.txt release-info.json
          release_id="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > remote-assets.json
          for file in "showly-$TAG-unsigned.hap" SHA256SUMS.txt release-info.json; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            size="$(stat -c%s "$file")"
            jq -e --arg file "$file" --arg digest "$digest" --argjson size "$size" \
              '[.[] | select(.name == $file and .state == "uploaded" and .digest == $digest and .size == $size)] | length == 1' \
              remote-assets.json >/dev/null
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          echo "[Unsigned preview release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
